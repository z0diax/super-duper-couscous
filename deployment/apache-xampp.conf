# Add this block inside the existing <VirtualHost *:80>, before any
# catch-all WSGIScriptAlias / or ProxyPass / directive, then restart Apache.
Alias /hrmdo-document-tracking-system "C:/xampp/htdocs/hrmdo-document-tracking-system"
Alias /hrmdo-document-tracking-system/ "C:/xampp/htdocs/hrmdo-document-tracking-system/"

<Directory "C:/xampp/htdocs/hrmdo-document-tracking-system">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
