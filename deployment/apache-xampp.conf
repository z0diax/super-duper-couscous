# Add this block inside the existing <VirtualHost *:80>, before any
# catch-all WSGIScriptAlias / or ProxyPass / directive, then restart Apache.
Alias /hrmdorms "D:/xampp/htdocs/hrmdorms"
Alias /hrmdorms/ "D:/xampp/htdocs/hrmdorms/"

<Directory "D:/xampp/htdocs/hrmdorms">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
